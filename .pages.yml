
media:
  input: media
  output: /media
  categories:
    - image

content:
  - name: profile
    label: Profile
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: full_name
        label: Full Name
        type: string
      - name: headline
        label: Professional Headline
        type: string
      - name: location
        label: Location
        type: string
      - name: photo
        label: Profile Photo
        type: image
      - name: about
        label: About Me
        type: rich-text
      - name: email
        label: Email
        type: string
      - name: phone
        label: Phone
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
      - name: portfolio
        label: Portfolio URL
        type: string

  - name: experience
    label: Work Experience
    type: collection
    path: content/experience
    format: json
    filename: "{primary}.json"
    view:
      primary: position
    fields:
      - name: position
        label: Position
        type: string
      - name: company
        label: Company
        type: string
      - name: period
        label: Period
        type: string
      - name: description
        label: Description
        type: rich-text
      - name: sort_order
        label: Display Order
        type: number

  - name: projects
    label: Projects & Portfolio
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Project Title
        type: string
      - name: year
        label: Year
        type: string
      - name: category
        label: Category
        type: string
      - name: description
        label: Description
        type: rich-text
      - name: technologies
        label: Technologies
        type: text
      - name: image
        label: Project Image
        type: image
      - name: sort_order
        label: Display Order
        type: number

  - name: skills
    label: Skills
    type: collection
    path: content/skills
    format: json
    filename: "{primary}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Skill Name
        type: string
      - name: category
        label: Category
        type: string
      - name: level
        label: Proficiency
        type: string
      - name: sort_order
        label: Display Order
        type: number

  - name: education
    label: Education
    type: collection
    path: content/education
    format: json
    filename: "{primary}.json"
    view:
      primary: institution
    fields:
      - name: institution
        label: Institution
        type: string
      - name: degree
        label: Degree
        type: string
      - name: period
        label: Period
        type: string
      - name: description
        label: Description
        type: text

  - name: awards
    label: Awards & Certifications
    type: collection
    path: content/awards
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Award Title
        type: string
      - name: organization
        label: Organization
        type: string
      - name: year
        label: Year
        type: string
      - name: description
        label: Description
        type: text
